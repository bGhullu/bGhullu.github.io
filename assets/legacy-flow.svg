<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img"
     aria-label="Legacy system data flow: RPC ingestion to pool state, route generation, strategy detection, quoting, simulation, execution gate, submission, and monitoring">
  <style>
    .bg{fill:#0a0e13}
    .box{fill:#11171f;stroke:#232d3a;stroke-width:1.5}
    .lane{fill:#161e28;stroke:#232d3a;stroke-width:1.5;stroke-dasharray:6 5}
    .t{fill:#d7e0ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;font-weight:600}
    .s{fill:#93a3b5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:12.5px}
    .lt{fill:#6b7c8f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:11.5px;letter-spacing:1.6px}
    .arr{stroke:#4cc2ff;stroke-width:2;fill:none;marker-end:url(#ah)}
    .arr2{stroke:#7ee0c0;stroke-width:2;fill:none;marker-end:url(#ah2)}
    .alt{stroke:#93a3b5;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#ah3)}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4cc2ff"/>
    </marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#7ee0c0"/>
    </marker>
    <marker id="ah3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#93a3b5"/>
    </marker>
  </defs>

  <rect class="bg" width="900" height="640" rx="14"/>

  <!-- Lane: data plane -->
  <rect class="lane" x="24" y="40" width="270" height="560" rx="12"/>
  <text class="lt" x="44" y="66">DATA / STATE PLANE</text>

  <!-- Lane: decision plane -->
  <rect class="lane" x="318" y="40" width="270" height="560" rx="12"/>
  <text class="lt" x="338" y="66">DETECTION / DECISION PLANE</text>

  <!-- Lane: execution plane -->
  <rect class="lane" x="612" y="40" width="264" height="560" rx="12"/>
  <text class="lt" x="632" y="66">EXECUTION PLANE</text>

  <!-- data plane boxes -->
  <rect class="box" x="48" y="86" width="222" height="66" rx="9"/>
  <text class="t" x="64" y="114">WS / HTTP RPC</text>
  <text class="s" x="64" y="136">block + log ingestion, failover</text>

  <rect class="box" x="48" y="196" width="222" height="66" rx="9"/>
  <text class="t" x="64" y="224">Unified pool state</text>
  <text class="s" x="64" y="246">reserves, slots, ticks, balances</text>

  <rect class="box" x="48" y="306" width="222" height="66" rx="9"/>
  <text class="t" x="64" y="334">Atomic snapshot</text>
  <text class="s" x="64" y="356">consistent view for requote</text>

  <rect class="box" x="48" y="416" width="222" height="66" rx="9"/>
  <text class="t" x="64" y="444">Persistence</text>
  <text class="s" x="64" y="466">pools / tokens / cache databases</text>

  <!-- decision plane boxes -->
  <rect class="box" x="342" y="86" width="222" height="66" rx="9"/>
  <text class="t" x="358" y="114">Route generation</text>
  <text class="s" x="358" y="136">primary + fallback routes</text>

  <rect class="box" x="342" y="196" width="222" height="66" rx="9"/>
  <text class="t" x="358" y="224">Strategy detection</text>
  <text class="s" x="358" y="246">cross-DEX · triangular · multi-hop</text>

  <rect class="box" x="342" y="306" width="222" height="66" rx="9"/>
  <text class="t" x="358" y="334">Quote + profit estimate</text>
  <text class="s" x="358" y="356">conservative ranking values</text>

  <rect class="box" x="342" y="416" width="222" height="66" rx="9"/>
  <text class="t" x="358" y="444">Execution planning</text>
  <text class="s" x="358" y="466">revalidation + gas modelling</text>

  <!-- execution plane boxes -->
  <rect class="box" x="636" y="86" width="216" height="66" rx="9"/>
  <text class="t" x="652" y="114">Simulation</text>
  <text class="s" x="652" y="136">fork / state-override check</text>

  <rect class="box" x="636" y="196" width="216" height="66" rx="9"/>
  <text class="t" x="652" y="224">Execution gate</text>
  <text class="s" x="652" y="246">dry-run kill switch (fail-closed)</text>

  <rect class="box" x="636" y="306" width="216" height="66" rx="9"/>
  <text class="t" x="652" y="334">Sign + submit</text>
  <text class="s" x="652" y="356">bundle / direct backends</text>

  <rect class="box" x="636" y="416" width="216" height="66" rx="9"/>
  <text class="t" x="652" y="444">Monitor + recover</text>
  <text class="s" x="652" y="466">receipts, reorg handling, RBF</text>

  <!-- vertical arrows -->
  <path class="arr" d="M159,152 L159,192"/>
  <path class="arr" d="M159,262 L159,302"/>
  <path class="arr" d="M159,372 L159,412"/>

  <path class="arr" d="M453,152 L453,192"/>
  <path class="arr" d="M453,262 L453,302"/>
  <path class="arr" d="M453,372 L453,412"/>

  <path class="arr" d="M744,152 L744,192"/>
  <path class="arr" d="M744,262 L744,302"/>
  <path class="arr" d="M744,372 L744,412"/>

  <!-- cross-plane arrows -->
  <path class="arr" d="M270,229 L338,119"/>
  <path class="arr" d="M564,229 L632,119"/>
  <path class="arr" d="M564,449 L632,339"/>

  <path class="alt" d="M564,339 L632,229"/>

  <!-- footnote -->
  <text class="s" x="44" y="626">Solid arrow = primary path · dashed arrow = secondary / conditional path</text>
</svg>
